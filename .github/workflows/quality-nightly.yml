name: LocalOS nightly quality gate

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: localos_test
          POSTGRES_PASSWORD: localos_test
          POSTGRES_DB: localos_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U localos_test -d localos_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      LOCALOS_TEST_DATABASE_URL: postgresql://localos_test:localos_test@127.0.0.1:5432/localos_ci_test
      TEST_DATABASE_URL: postgresql://localos_test:localos_test@127.0.0.1:5432/localos_ci_test
      DATABASE_URL: postgresql://localos_test:localos_test@127.0.0.1:5432/localos_ci_test
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt -r requirements.test.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run full sequential quality gate
        run: bash scripts/ci_gate_nightly.sh
      - name: Read-only production health smoke
        run: curl --fail --silent --show-error --retry 3 --max-time 20 https://localos.pro/health
