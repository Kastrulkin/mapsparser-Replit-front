name: LocalOS isolated quality gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: localos_test
          POSTGRES_PASSWORD: localos_test
          POSTGRES_DB: localos_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U localos_test -d localos_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      LOCALOS_TEST_DATABASE_URL: postgresql://localos_test:localos_test@127.0.0.1:5432/localos_ci_test
      DATABASE_URL: postgresql://localos_test:localos_test@127.0.0.1:5432/localos_ci_test
      BASE_URL: http://127.0.0.1:8000
      PYTHONPATH: src
      LOCALOS_TODAY_ACTIVITY_ENABLED: "false"
      LOCALOS_TODAY_PROPOSALS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt -r requirements.test.txt
      - name: Backend contracts and real PostgreSQL regressions
        run: bash scripts/ci_gate_localos_plan.sh
      - name: Isolated compiled-source adversarial integration
        run: python scripts/test_compiled_runner_docker.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: TypeScript changed-module check
        working-directory: frontend
        run: python ../scripts/check_frontend_typecheck_scope.py
      - name: Frontend behavioral regressions
        working-directory: frontend
        run: npm run test -- src/components/agents/CompiledScriptBuilder.test.tsx src/components/DashboardSidebar.i18n.test.tsx src/pages/dashboard/TodayPage.test.tsx src/pages/dashboard/OperatorPage.i18n.test.tsx src/pages/dashboard/InfluencersPage.test.tsx src/pages/dashboard/InfluencerPromotionPage.test.tsx
      - name: Production frontend builds
        working-directory: frontend
        run: npm run build:all

# Live provider smokes belong to an explicitly selected staging release.
# This workflow has no provider credentials and never targets production.
