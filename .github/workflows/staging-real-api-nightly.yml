name: LocalOS synthetic real-API staging journeys

on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localos-real-api-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-api-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install host Chromium for Playwright
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: npx --no-install playwright install --with-deps chromium
      - name: Run synthetic staging browser journeys
        run: bash scripts/ci_real_api_staging.sh
      - name: Retain synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-api-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/localos-ci-real-api-${{ github.run_id }}-${{ github.run_attempt }}/metadata.json
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: warn
          retention-days: 7
