name: localos-readiness-hflypi
services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16-trixie
    pull_policy: never
    restart: "no"
    container_name: localos-readiness-hflypi-postgres-1
    labels:
      localos.audit.owner: production-readiness-20260917-hfLYPi
    environment:
      POSTGRES_USER: audit_owner
      POSTGRES_PASSWORD: hflypi-local-only
      POSTGRES_DB: readiness_hflypi
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    ports:
      - "127.0.0.1:35418:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
      - pg_ingress
    mem_limit: 768m
    cpus: 2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_owner -d readiness_hflypi"]
      interval: 3s
      timeout: 2s
      retries: 20
  migrate: &audit_app_base
    image: localos-audit-20260921:99849935-hflypi
    pull_policy: never
    restart: "no"
    labels:
      localos.audit.owner: production-readiness-20260917-hfLYPi
    environment: &audit_environment
      APP_ENV: test
      PYTHON_DOTENV_DISABLED: "1"
      FLASK_APP: src.main:app
      LOCALOS_MIGRATION_MODE: migrate-only
      DATABASE_URL: postgresql://audit_owner:hflypi-local-only@postgres:5432/readiness_hflypi
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: audit_owner
      POSTGRES_PASSWORD: hflypi-local-only
      POSTGRES_DB: readiness_hflypi
      RATE_LIMITING_ENABLED: "false"
      SMTP_SERVER: "127.0.0.1"
      SMTP_PORT: "1"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      TELEGRAM_BOT_TOKEN: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      APIFY_TOKEN: ""
      STRIPE_SECRET_KEY: ""
      OUTREACH_DISPATCH_ENABLED: "false"
      OUTREACH_EMAIL_THREAD_SYNC_ENABLED: "false"
      OUTREACH_TELEGRAM_THREAD_SYNC_ENABLED: "false"
      SOCIAL_POST_DISPATCH_ENABLED: "false"
      AGENT_ASYNC_RUNS_ENABLED: "false"
      AGENT_SCHEDULE_DISPATCH_ENABLED: "false"
      JOURNEY_NOTIFICATIONS_ENABLED: "false"
    command: ["true"]
    networks:
      - internal
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 256
  app:
    <<: *audit_app_base
    environment:
      <<: *audit_environment
      LOCALOS_MIGRATION_MODE: schema-check-only
      FRONTEND_DIST_DIR: /app/frontend/dist
    command: ["python", "src/main.py"]
    ports:
      - "127.0.0.1:38091:8000"
  web:
    <<: *audit_app_base
    environment:
      <<: *audit_environment
      LOCALOS_MIGRATION_MODE: schema-check-only
      FRONTEND_DIST_DIR: /app/frontend/dist
    command:
      - sh
      - -c
      - exec gunicorn --bind 0.0.0.0:8000 --workers "$${WEB_CONCURRENCY:-2}" --threads "$${WEB_THREADS:-4}" --timeout "$${GUNICORN_TIMEOUT:-300}" --access-logfile - --error-logfile - src.main:app
volumes:
  pgdata:
    name: localos-readiness-hflypi-pgdata
    labels:
      localos.audit.owner: production-readiness-20260917-hfLYPi
networks:
  internal:
    name: localos-readiness-hflypi_internal
    internal: true
    labels:
      localos.audit.owner: production-readiness-20260917-hfLYPi
  pg_ingress:
    name: localos-readiness-hflypi_pg_ingress
    labels:
      localos.audit.owner: production-readiness-20260917-hfLYPi
