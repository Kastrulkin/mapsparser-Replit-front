  <script>
    // CRITICAL DEBUGGER FOR WHITE SCREEN
    window.onerror = function (msg, url, lineNo, columnNo, error) {
      var container = document.getElementById('debug-error-container');
      if (!container) {
        container = document.createElement('div');
        container.id = 'debug-error-container';
        container.style.position = 'fixed';
        container.style.top = '0';
        container.style.left = '0';
        container.style.width = '100%';
        container.style.height = '100vh';
        container.style.backgroundColor = '#fff0f0';
        container.style.color = '#c00';
        container.style.padding = '20px';
        container.style.zIndex = '999999';
        container.style.overflow = 'auto';
        container.style.fontFamily = 'monospace';
        container.style.whiteSpace = 'pre-wrap';
        document.body.appendChild(container);
      }
      var message = "Error: " + msg + "\nURL: " + url + "\nLine: " + lineNo + ":" + columnNo;
      if (error && error.stack) message += "\nStack:\n" + error.stack;
      container.textContent += "\n----------------\n" + message;
      return false;
    };
    window.addEventListener('unhandledrejection', function (event) {
      window.onerror(event.reason ? event.reason.message : 'Unhandled Rejection', '', 0, 0, event.reason);
    });
  </script>

  <script id="localos-public-tracking-consent">
    (function () {
      var metrikaCounterId = 105600878;
      var exactPublicPaths = [
        '/', '/about', '/contact', '/policy', '/privacy', '/data-deletion', '/requisites'
      ];
      var publicPathPrefixes = ['/docs/', '/articles/', '/documents/', '/cases/'];

      function isPublicMarketingPath(pathname) {
        if (exactPublicPaths.indexOf(pathname) !== -1) return true;
        if (pathname === '/docs' || pathname === '/articles' || pathname === '/documents' || pathname === '/cases') return true;
        return publicPathPrefixes.some(function (prefix) { return pathname.indexOf(prefix) === 0; });
      }

      function enableYandexMetrika() {
        if (window.localosMetrikaEnabled) return;
        window.localosMetrikaEnabled = true;
        window.ym = window.ym || function () { (window.ym.a = window.ym.a || []).push(arguments); };
        window.ym.l = window.ym.l || 1 * new Date();
        if (!document.querySelector('script[data-localos-yandex-metrika]')) {
          var script = document.createElement('script');
          script.async = true;
          script.src = 'https://mc.yandex.ru/metrika/tag.js?id=' + metrikaCounterId;
          script.dataset.localosYandexMetrika = 'true';
          document.head.appendChild(script);
        }
        window.ym(metrikaCounterId, 'init', { ssr: true, webvisor: true, clickmap: true, ecommerce: 'dataLayer', accurateTrackBounce: true, trackLinks: true });
      }

      function disableYandexMetrika() {
        if (!window.localosMetrikaEnabled) return;
        if (window.ym) window.ym(metrikaCounterId, 'destruct');
        window.localosMetrikaEnabled = false;
      }

      function syncLocalOSTrackingConsent() {
        var allowed = isPublicMarketingPath(window.location.pathname || '/');
        window.localosTrackingConsent = allowed;
        if (window.LocalOSTracker) window.LocalOSTracker.setConsent(allowed, { emitPageView: false });
        if (allowed) enableYandexMetrika();
        else disableYandexMetrika();
      }

      ['pushState', 'replaceState'].forEach(function (method) {
        var original = window.history[method];
        if (!original) return;
        window.history[method] = function () {
          var result = original.apply(this, arguments);
          window.setTimeout(syncLocalOSTrackingConsent, 0);
          return result;
        };
      });
      window.addEventListener('popstate', syncLocalOSTrackingConsent);
      syncLocalOSTrackingConsent();
    })();
  </script>
