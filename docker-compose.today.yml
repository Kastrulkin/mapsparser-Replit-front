# Independent application flags; no automatic sends or scripts are enabled here.
services:
  app:
    environment:
      LOCALOS_TODAY_PERSONALIZATION_ENABLED: ${LOCALOS_TODAY_PERSONALIZATION_ENABLED:-true}
      LOCALOS_TODAY_ACTIVITY_ENABLED: ${LOCALOS_TODAY_ACTIVITY_ENABLED:-false}
      LOCALOS_TODAY_PROPOSALS_ENABLED: ${LOCALOS_TODAY_PROPOSALS_ENABLED:-false}
  worker:
    environment:
      LOCALOS_TODAY_PERSONALIZATION_ENABLED: ${LOCALOS_TODAY_PERSONALIZATION_ENABLED:-true}
      LOCALOS_TODAY_ACTIVITY_ENABLED: ${LOCALOS_TODAY_ACTIVITY_ENABLED:-false}
      LOCALOS_TODAY_PROPOSALS_ENABLED: ${LOCALOS_TODAY_PROPOSALS_ENABLED:-false}
