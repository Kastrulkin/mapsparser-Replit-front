  APIFY_ACTOR_ID: ""
  APIFY_YANDEX_ACTOR_ID: ""
  APIFY_2GIS_ACTOR_ID: ""
  APIFY_TWOGIS_ACTOR_ID: ""
  APIFY_PROXY_URL: ""
  APIFY_HTTP_PROXY: ""
  APIFY_HTTPS_PROXY: ""
  CRYPTO_PAY_API_TOKEN: ""
  CRYPTO_PAY_WEBHOOK_SECRET: ""
  DEEPSEEK_API_KEY: ""
  GIGACHAT_KEYS: ""
  GIGACHAT_CLIENT_ID: ""
  GIGACHAT_CLIENT_SECRET: ""
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  GOOGLE_OAUTH_STATE_SECRET: ""
  GOOGLE_SHEETS_CLIENT_ID: ""
  GOOGLE_SHEETS_CLIENT_SECRET: ""
  HUNTER_API_KEY: ""
  MEDIA_S3_ACCESS_KEY_ID: ""
  MEDIA_S3_SECRET_ACCESS_KEY: ""
  META_OAUTH_APP_ID: ""
  META_OAUTH_APP_SECRET: ""
  META_OAUTH_CONFIG_ID: ""
  META_OAUTH_STATE_SECRET: ""
  OPENCLAW_LOCALOS_TOKEN: ""
  OPENCLAW_SANDBOX_BRIDGE_TOKEN: ""
  OPENCLAW_TOKEN: ""
  OUTBOUND_HTTP_PROXY: ""
  OUTREACH_VK_SECRET_KEY: ""
  SALES_ROOM_S3_ACCESS_KEY_ID: ""
  SALES_ROOM_S3_SECRET_ACCESS_KEY: ""
  TELEGRAM_HTTP_PROXY: ""
  TELEGRAM_PROXY_URL: ""
  TELEGRAM_REVIEWS_BOT_TOKEN: ""
  TELEGRAM_USERBOT_MTPROXY_HOST: ""
  TELEGRAM_USERBOT_MTPROXY_PORT: ""
  TELEGRAM_USERBOT_MTPROXY_SECRET: ""
  TELEGRAM_USERBOT_PROXY: ""
  VK_OAUTH_CLIENT_ID: ""
  VK_OAUTH_STATE_SECRET: ""
  WHATSAPP_VERIFY_TOKEN: ""
  YANDEX_AI_API_KEY: ""
  YANDEX_WORDSTAT_API_KEY: ""
  YANDEX_WORDSTAT_CLIENT_ID: ""
  YANDEX_WORDSTAT_CLIENT_SECRET: ""
  YANDEX_WORDSTAT_OAUTH_TOKEN: ""
  YOOKASSA_SHOP_ID: ""
  YOOKASSA_SECRET_KEY: ""

services:
  redis:
    restart: "no"

  postgres:
    restart: "no"
    environment:
      POSTGRES_USER: localos_staging
      POSTGRES_PASSWORD: localos_staging_only
      POSTGRES_DB: localos_staging

  app:
    build:
      args:
        INSTALL_PLAYWRIGHT_BROWSER: "false"
        VITE_CONTENT_JOURNEY_ENABLED: "true"
        VITE_JOURNEY_ADMIN_BUILDER_ENABLED: "true"
        VITE_JOURNEY_POST_AUTH_REDIRECT_ENABLED: "true"
        VITE_GROWTH_PATHS_NAVIGATION_ENABLED: "true"
        VITE_BLOCK_ACCESS_V2_ENABLED: "true"
        VITE_BROWSER_COOKIE_AUTH_ENABLED: "true"
        VITE_PROMOTION_HUB_ENABLED: "true"
    restart: "no"
    volumes: !override []
    ports: !override
      - "${STAGING_PORT:-18000}:8000"
    environment:
      <<: *staging-blank-provider-credentials
      APP_ENV: staging
      DATABASE_URL: postgresql://localos_staging:localos_staging_only@postgres:5432/localos_staging
      POSTGRES_USER: localos_staging
      POSTGRES_PASSWORD: localos_staging_only
      POSTGRES_DB: localos_staging
      FRONTEND_URL: http://127.0.0.1:${STAGING_PORT:-18000}
      ALLOWED_ORIGINS: http://127.0.0.1:${STAGING_PORT:-18000}
      RATE_LIMITING_ENABLED: "false"
      BROWSER_COOKIE_AUTH_ENABLED: "true"
      BROWSER_COOKIE_AUTH_SECURE: "false"
      SMTP_SERVER: localhost
      SMTP_PORT: "1"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      EXTERNAL_AUTH_SECRET_KEY: ${EXTERNAL_AUTH_SECRET_KEY:-localos-staging-external-auth-only}
      OUTREACH_EMAIL_SECRET_KEY: ${OUTREACH_EMAIL_SECRET_KEY:-localos-staging-outreach-email-only}
      TELEGRAM_BOT_TOKEN: "localos-staging-e2e-bot-token"
      OUTREACH_DISPATCH_ENABLED: "false"
      OUTREACH_EMAIL_THREAD_SYNC_ENABLED: "false"
      OUTREACH_TELEGRAM_THREAD_SYNC_ENABLED: "false"
      SOCIAL_POST_DISPATCH_ENABLED: "false"
      AGENT_ASYNC_RUNS_ENABLED: "false"
      AGENT_SCHEDULE_DISPATCH_ENABLED: "false"
      LEAD_JOURNEY_ENABLED: "true"
      INFLUENCER_JOURNEY_ENABLED: "true"
      PARTNERSHIP_JOURNEY_ENABLED: "true"
      MAPS_JOURNEY_ENABLED: "true"
      CONTENT_JOURNEY_ENABLED: "true"
      AUTOMATION_JOURNEY_ENABLED: "true"
      PROMOTION_HUB_ENABLED: "true"
      INFLUENCER_DISCOVERY_ENABLED: "true"
      INFLUENCER_OUTREACH_ENABLED: "false"
      INFLUENCER_METRICS_ENABLED: "false"
      INFLUENCER_SOURCE_ENRICHMENT_ENABLED: "false"
      OPERATOR_MAP_REFRESH_SOURCE: yandex_maps
      OPERATOR_APIFY_REFRESH_ENABLED: "false"
      JOURNEY_ADMIN_BUILDER_ENABLED: "true"
      JOURNEY_POST_AUTH_REDIRECT_ENABLED: "true"
      GROWTH_PATHS_NAVIGATION_ENABLED: "true"
      BLOCK_ACCESS_V2_ENABLED: "true"
      JOURNEY_NOTIFICATIONS_ENABLED: "false"
      JOURNEY_UPSELL_ENABLED: "false"

  worker:
    restart: "no"
    volumes: !override []
    environment:
      <<: *staging-blank-provider-credentials
      APP_ENV: staging
      DATABASE_URL: postgresql://localos_staging:localos_staging_only@postgres:5432/localos_staging
      POSTGRES_USER: localos_staging
      POSTGRES_PASSWORD: localos_staging_only
      POSTGRES_DB: localos_staging
      SMTP_SERVER: localhost
      SMTP_PORT: "1"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      EXTERNAL_AUTH_SECRET_KEY: ${EXTERNAL_AUTH_SECRET_KEY:-localos-staging-external-auth-only}
      OUTREACH_EMAIL_SECRET_KEY: ${OUTREACH_EMAIL_SECRET_KEY:-localos-staging-outreach-email-only}
      TELEGRAM_BOT_TOKEN: "localos-staging-e2e-bot-token"
      OUTREACH_DISPATCH_ENABLED: "false"
      OUTREACH_EMAIL_THREAD_SYNC_ENABLED: "false"
      OUTREACH_TELEGRAM_THREAD_SYNC_ENABLED: "false"
      SOCIAL_POST_DISPATCH_ENABLED: "false"
      AGENT_ASYNC_RUNS_ENABLED: "false"
      AGENT_SCHEDULE_DISPATCH_ENABLED: "false"
      JOURNEY_NOTIFICATIONS_ENABLED: "false"

  telegram-bot:
    restart: "no"
    volumes: !override []
    environment:
      <<: *staging-blank-provider-credentials
      APP_ENV: staging
      DATABASE_URL: postgresql://localos_staging:localos_staging_only@postgres:5432/localos_staging
      POSTGRES_USER: localos_staging
      POSTGRES_PASSWORD: localos_staging_only
      POSTGRES_DB: localos_staging
      TELEGRAM_BOT_TOKEN: "localos-staging-e2e-bot-token"
